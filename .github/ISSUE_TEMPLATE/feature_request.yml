name: Feature request
description: Suggest an idea or improvement for Mihrab
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Mihrab keeps a high bar and a calm, private, ad-free posture. Ideas that fit that spirit are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and where does the app get in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Prayer times & calculation
        - Notifications & adhan
        - Home-screen widgets
        - Live Activity
        - Quran reader / Tilāwah
        - Duas / Tasbih / Qibla
        - Calendar / Fasting / Journal
        - Settings & appearance
        - Localization / translation
        - Other
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this isn't already requested.
          required: true
        - label: This keeps Mihrab's posture — no ads, no analytics, F-Droid-compatible, no in-app purchases.
          required: false
